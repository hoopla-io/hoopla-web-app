services:
  hoopla_web_app:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.hoopla.uz/v2}
    restart: always
    ports:
      - "3013:3000"
    environment:
      - NODE_ENV=production

  # Same code, Eight-miniapp build. Served at anor.hoopla.uz.
  hoopla_web_anor:
    build:
      context: .
      args:
        BUILD_MODE: anor
        VITE_API_URL: ${VITE_API_URL:-https://api.hoopla.uz/v2}
    restart: always
    ports:
      - "3014:3000"
    environment:
      - NODE_ENV=production
