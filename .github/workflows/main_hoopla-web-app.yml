# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - hoopla-web-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
      - uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: https://index.docker.io/v1/
          username: ${{ secrets.AzureAppService_ContainerUsername_816ea55ddcb74618a1f72cc1be7d6baf }}
          password: ${{ secrets.AzureAppService_ContainerPassword_8fe7bf062f5841918b74162f89453f4a }}

      - name: Inject Environment Variables
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> .env

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_816ea55ddcb74618a1f72cc1be7d6baf }}/hoopla-web-app:${{ github.sha }}
          file: ./Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'hoopla-web-app'
          slot-name: 'production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_64c81b06a9b44855ba68c266241591b3 }}
          images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_816ea55ddcb74618a1f72cc1be7d6baf }}/hoopla-web-app:${{ github.sha }}'
