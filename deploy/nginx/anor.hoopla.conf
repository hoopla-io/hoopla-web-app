server {
    server_name anor.hoopla.uz;

    charset utf-8;
    access_log off;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # The launch token arrives as a query param. We strip it from the address
    # bar as soon as it's captured, but any subresource requested before that
    # would otherwise carry it in a Referer header to a third party.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Miniapp, not a public site — keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3014;
    }

    listen 80;
}
